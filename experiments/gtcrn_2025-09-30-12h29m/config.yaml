network_config:
  n_fft: 256
  hop_len: 128
  win_len: 256
  preprocess:
    enable: true
    highpass:
      enable: true
      cutoff_bin: 2
      attenuation_db: 18.0
    level:
      enable: true
      target_rms: 0.1
      min_gain_db: -12.0
      max_gain_db: 12.0
    noise_shave:
      enable: true
      quantile: 0.1
      scale: 1.0
      floor_db: -40.0
    wiener:
      enable: true
      noise_quantile: 0.1
      aggressiveness: 1.5
      min_gain: 0.25
DDP:
  world_size: 1
optimizer:
  lr: 0.001
scheduler:
  kwargs:
    warmup_steps: 25000
    decay_until_step: 250000
    max_lr: 0.001
    min_lr: 1.0e-06
  update_interval: step
FFT:
  n_fft: 256
  hop_length: 128
  win_length: 256
loss:
  n_fft: ${FFT.n_fft}
  hop_len: ${FFT.hop_length}
  win_len: ${FFT.win_length}
  compress_factor: 0.3
  eps: 1.0e-12
  lamda_ri: 30
  lamda_mag: 70
train_dataset:
  length_in_seconds: 10
  num_data_tot: 72000
  num_data_per_epoch: 10000
  random_start_point: false
  train: true
train_dataloader:
  batch_size: 8
  num_workers: 4
  drop_last: true
  pin_memory: true
validation_dataset:
  length_in_seconds: 10
  random_start_point: false
  train: false
  split: validation
validation_dataloader:
  batch_size: 4
  num_workers: 4
  pin_memory: true
test_dataset:
  length_in_seconds: 10
  random_start_point: false
  train: false
  split: test
test_dataloader:
  batch_size: 4
  num_workers: 4
  pin_memory: true
samplerate: 16000
trainer:
  epochs: 200
  save_checkpoint_interval: 1
  clip_grad_norm_value: 3.0
  exp_path: /home/terzano/Desktop/NNs/SEtrain/experiments/gtcrn
  resume: false
  resume_datetime: 2024-12-31-14h28m
