network_config:
  n_fft: 256
  hop_len: 128
  win_len: 256
optimizer:
  lr: 0.0003
  betas:
  - 0.9
  - 0.999
  eps: 1.0e-08
  weight_decay: 0.0
scheduler:
  kwargs:
    warmup_steps: 500
    decay_until_step: 10000
    max_lr: 0.0003
    min_lr: 1.0e-05
  update_interval: step
qat:
  enabled: true
  backend: fbgemm
  quantize_deconv: true
  disable_observer_epoch: 12
  freeze_bn_epoch: 15
distillation:
  enabled: true
  teacher_checkpoint: /home/terzano/Desktop/NNs/SEtrain/experiments/gtcrn_2025-10-01-16h05m/checkpoints/best_model_111.tar
blockwise_distillation:
  enabled: true
  epochs_per_block: 20
  loss: mse
  train_encoder: true
  train_decoder: true
  blocks: all
  student_checkpoint: ''
  max_steps_per_epoch: -1
  save_checkpoint_interval: 2
  clip_grad_norm_value: 3.0
  exp_path: /home/terzano/Desktop/NNs/gtcrn-qat/SEtrain/experiments/
train_dataset:
  length_in_seconds: 10
  num_data_tot: 72000
  num_data_per_epoch: 4000
  random_start_point: true
  train: true
train_dataloader:
  batch_size: 8
  num_workers: 4
  drop_last: true
  pin_memory: true
samplerate: 16000
